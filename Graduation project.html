<!DOCTYPE html>
<html lang = "zh-CN">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width-device-width, initial-scale = 1.0">
        <title>个人主页</title>
        <style>
            body{
                background-color:azure;
                font-family:PingFang SC, Microsoft YaHei, sans-serif;
            }
            h1{
                color:rgb(0, 98, 255);
            }
            h2{
                color:rgb(0, 98, 255);
            }
            .card{
                background-color:white;
                padding:24px;
                margin:40px auto;
                max-width:600px;
                border-radius:12px;
            }
            button{
                background-color:rgb(0, 98, 255);
                color:white;
                padding:10px;
                border:none;
                border-radius:6px;
                cursor:pointer;
            }
        </style>
        <body>
            <div class = "card">
                <h1>我的名字是<strong>郭兆辉</strong></h1>
                <p>二十少年，修学不倦，修心不止</p>
                <img src = "https://example.com/avatar.jpg" alt = "我的头像" width = "200px">
                <h2>我的技能</h2>
                <ul>
                    <li>正在学习 HTML/CSS/JS</li>
                    <li>csgo高手</li>
                    <li>羽毛球高手</li>
                    <li>女生猎杀者</li>
                </ul>
                <h2>我的邮箱</h2>
                <a href = "mailto:yaoyiming06@gmail.com">yaoyiming06@gmail.com</a>
                <h2>想了解更多？</h2>
                <p>访问我的<a href = "https://www.douyin.com/user/self?from_tab_name=main" target = "_blank">抖音</a></p>
                <h3>告诉你一个秘密......</h3>
                <button id = "secretbutton">是什么？</button>
                <p id = "secret"></p>
            </div>
            <script>
                const secretbutton = document.querySelector('#secretbutton');
                const secret = document.querySelector('#secret');
                secretbutton.addEventListener('click', function(){
                    secret.textContent = '我明天回学校了';
                })
            </script>
        </body>
    </head>
</html>
