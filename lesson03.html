<!DOCTYPE html>
<html lang = "zh-CN">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = " width=device-width, initial-scale=1.0">
        <title>打招呼页面</title>
    </head>
    <style>
        body{
            background-color:rgb(228, 222, 222);
            font-family:PingFang SC, Microsoft YaHei, sans-serif;
        }
        .card{
            max-width:600px;
            margin:40px auto;
            padding:24px;
            background-color:rgb(255, 255, 255);
            border-radius:12px;
        }
        .index{
            line-height: 1.6;
            font-size: 20px;
            color:rgb(48, 184, 247);
        }
        h1{
            color:rgb(22, 111, 227);
        }
        input{
            padding:24px;
            border:1px solid #ccc;
            border-radius:6px;
        }
        button{
            background-color:black;
            color:white;
            padding:10px;
            border:none;
            border-radius:6px;
            cursor:pointer;
        }
    </style>
    <body>
        <div class = "card">
            <h1>您好，很高兴能认识您</h1>
            <p>我的名字是<h3 class = "index">郭兆辉</h3></p>
            <h2>和我打个招呼吧</h2>
            <input id = "nameInput" placeholder = "你的名字">
            <button id = "buttoncheck">打招呼</button>
            <p id = "answer"></p>
            <h2>我的爱好</h2>
            <ul>
                <li>关注<strong>财经</strong></li>
                <li>关注科技</li>
                <li>在假期享受生活 体验与学校不同的生活方式</li>
            </ul>
        </div>
        <script>
            const nameinput = document.querySelector('#nameInput');
            const buttoncheck = document.querySelector('#buttoncheck');
            const answer = document.querySelector('#answer');
            buttoncheck.addEventListener('click',function(){
                const name = nameinput.value;
                if(name == ''){
                    answer.textContent = '请输入正确名字';
                }
                else{
                    answer.textContent = `你好，${name},很高兴认识你！`;
                }
            });
        </script>
    </body>
</html>
