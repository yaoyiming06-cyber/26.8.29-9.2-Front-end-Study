<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>郭兆辉个人介绍页 · CSS 预览版</title>
  <style>
    body {
      background-color: #f5f7fa;
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      max-width: 600px;
      margin: 40px auto;
      padding: 32px 24px;
      background-color: #ffffff;
      border-radius: 12px;
    }
    h1 {
      color: #1f6feb;
    }
    h2 {
      color: #333333;
      border-left: 4px solid #1f6feb;
      padding-left: 10px;
    }
    p {
      color: #555555;
      line-height: 1.8;
    }
    ul {
      color: #333333;
      line-height: 2;
    }
    a {
      color: #1f6feb;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>你好,我是<strong>郭兆辉</strong> 👋</h1>
    <p>一个正在成长的<strong>developer</strong>，希望能够不断学习和进步</p>

    <h2>我的爱好有以下几点：</h2>
    <ul>
      <li>关注财经</li>
      <li>关注科技</li>
      <li>在假期享受生活 体验与学校不同的生活方式</li>
    </ul>

    <h2>我最近喜欢的网站</h2>
    <p>去 <a href="https://www.bilibili.com" target="_blank">哔哩哔哩</a> 看我喜欢的主播。</p>
  </div>

  <!-- 注释:这是你第 1 课作业的 CSS 升级版,第 2 课学完你就能自己写出这些效果 -->
</body>
</html>
